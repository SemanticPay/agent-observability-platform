variables:
  EMBEDDING_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  GCS_BUCKET_NAME:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  GCS_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [config, agent.backend.copilotkit_agent]
  GOOGLE_CLOUD_PROJECT_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  PORT:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.backend.copilotkit_agent]
  tokens_query:
    type: env
    params:
      caller: [get_metrics_time_series]
  VERTEX_AI_INDEX_ENDPOINT_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  VERTEX_AI_INDEX_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [config]
  VERTEX_RAG_CORPUS:
    type: env
    params:
      caller: [os.getenv]
      path: [config]

files:
  .txt:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
  /tmp/uploads:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  Downloads/test-driver-license.jpeg:
    type: literal
    actions: [read]
    params:
      caller: [open]
      alias: [f]
  file_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  PHOTO_UPLOAD_PATH:
    type: literal
    actions: [read, write]
    params:
      caller: [Path('/tmp/uploads'), PHOTO_UPLOAD_PATH.mkdir]
