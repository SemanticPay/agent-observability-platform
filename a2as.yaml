models:
  gemini-2.5-flash:
    type: literal
    agents: [ORCHESTRATOR_AGENT, scheduler_agent, drivers_license_agent]

tools:
  book_exam:
    type: function
    agents: [scheduler_agent]
    params:
      description: "Book an exam slot at a clinic.\n\nArgs:\n    clinic_id: ID of the clinic\n    exam_type: Type of exam\
        \ (\"medical\" or \"driving\")\n    datetime_str: Date and time in ISO format\n    citizen_name: Name of the citizen\n\
        \    \nReturns:\n    Booking confirmation details"
  geocode_location:
    type: function
    agents: [scheduler_agent]
    params:
      description: "Geocode a location query using Google Maps API.\n\nArgs:\n    location_query: Natural language location\
        \ query (e.g., \"Vila Mariana, São Paulo\")\n    \nReturns:\n    List of possible locations with coordinates"
  get_drivers_license_context:
    type: function
    agents: [drivers_license_agent]
    params:
      description: "Retrieve relevant context from RAG pipeline for driver's license questions.\n\nArgs:\n    question: The\
        \ user's question\n    \nReturns:\n    Context string with relevant information"
  search_nearby_clinics:
    type: function
    agents: [scheduler_agent]
    params:
      description: "Search for verified clinics near a location.\n\nArgs:\n    exam_type: Type of exam (\"medical\" or \"\
        driving\")\n    \nReturns:\n    List of clinics with distance information"
  set_location_from_coordinates:
    type: function
    agents: [scheduler_agent]
    params:
      description: "Set location directly from coordinates (used when user selects location from map).\n\nArgs:\n    latitude:\
        \ Latitude coordinate (e.g., -23.5505)\n    longitude: Longitude coordinate (e.g., -46.6333)\n    \nReturns:\n   \
        \ Location object with the provided coordinates"

teams:
  ORCHESTRATOR_AGENT:
    type: hierarchy
    agents: [ORCHESTRATOR_AGENT, drivers_license_agent, scheduler_agent]

